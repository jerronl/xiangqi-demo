name: leaderboard
on:
  issues:
    types: [opened, edited, labeled, unlabeled, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  score:
    # 跳过本工作流自己打 scored 标签引起的事件
    if: github.event_name == 'workflow_dispatch' || github.event.label.name != 'scored'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python .github/scripts/leaderboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
